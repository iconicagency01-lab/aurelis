<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#1a1a1a; font-family:'Inter',sans-serif; overflow:hidden; }

  /* ─── Catalog header strip ─── */
  .cat-header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 44px; background: #0d0d0d;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; z-index: 30;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .cat-header .brand {
    font-family: 'Inter', sans-serif;
    font-size: 11px; letter-spacing: 4px; font-weight: 500;
    color: #fff; text-decoration: none;
  }
  .cat-header .vols { display: flex; gap: 22px; }
  .cat-header .vols a {
    font-family: 'Inter', sans-serif;
    font-size: 10px; letter-spacing: 2.5px; font-weight: 500;
    color: #888; text-decoration: none;
    text-transform: uppercase;
    transition: color 0.25s ease;
  }
  .cat-header .vols a:hover { color: #fff; }
  .cat-header .vols a.active { color: #fff; border-bottom: 1px solid #fff; padding-bottom: 2px; }

  .viewer { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:64px 20px 70px; }
  .book {
    display:flex; gap:0; height:100%; max-height:88vh;
    aspect-ratio: 1588 / 1123;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    transition: aspect-ratio 0.2s;
  }
  .book.single { aspect-ratio: 794 / 1123; }
  .page { flex:1; height:100%; background:#fff; overflow:hidden; position:relative; }
  .page svg { width:100%; height:100%; display:block; }
  .page.left { box-shadow: inset -8px 0 20px -10px rgba(0,0,0,0.25); }
  .page.right { box-shadow: inset 8px 0 20px -10px rgba(0,0,0,0.25); }

  .nav-zone { position:fixed; top:44px; bottom:70px; width:15%; cursor:pointer; z-index:10; }
  .nav-zone.left { left:0; }
  .nav-zone.right { right:0; }
  .nav-zone:hover::after { position:absolute; top:50%; transform:translateY(-50%); color:#fff; font-size:36px; opacity:0.5; font-family:serif; }
  .nav-zone.left:hover::after { content:'‹'; left:25px; }
  .nav-zone.right:hover::after { content:'›'; right:25px; }

  .toolbar {
    position:fixed; bottom:0; left:0; right:0; height:55px; background:#0d0d0d;
    display:flex; align-items:center; justify-content:center; gap:14px;
    color:#888; font-size:11px; letter-spacing:2px; z-index:20;
  }
  .toolbar button, .toolbar .icon-btn {
    background:none; border:1px solid #444; color:#ccc;
    padding:8px 14px; cursor:pointer; font-family:'Inter',sans-serif;
    font-size:10px; letter-spacing:2px;
    display:inline-flex; align-items:center; justify-content:center;
    transition: all 0.2s ease;
  }
  .toolbar button:hover, .toolbar .icon-btn:hover { border-color:#fff; color:#fff; }
  .toolbar .cta { border-color:#fff; color:#fff; padding:8px 20px; letter-spacing:2.5px; }
  .toolbar .cta:hover { background:#fff; color:#0d0d0d; }
  .toolbar .wa { padding:6px 10px; }
  .toolbar .wa svg { width:16px; height:16px; }
  .counter { font-family:'JetBrains Mono',monospace; min-width:90px; text-align:center; }

  /* ─── Overlay form ─── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,8,6,0.78);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    padding: 30px 20px;
  }
  .overlay.show { display: flex; }
  .overlay-inner {
    background: #fff; color: #1a1612;
    width: 100%; max-width: 540px;
    max-height: 92vh; overflow-y: auto;
    padding: 48px 44px;
    position: relative;
    animation: oin 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes oin { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .overlay-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px;
    background: none; border: none; cursor: pointer;
    font-size: 22px; color: #847866; font-family: 'Inter', sans-serif;
    line-height: 1;
  }
  .overlay-close:hover { color: #1a1612; }
  .overlay h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px; font-weight: 300; line-height: 1.1;
    margin-bottom: 8px;
  }
  .overlay h3 em { font-style: italic; color: #847866; }
  .overlay .sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 16px; color: #847866;
    margin-bottom: 28px;
  }
  .overlay .piece-badge {
    display: inline-block;
    margin-bottom: 28px;
    padding: 10px 16px;
    background: #1a1612; color: #fff;
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    font-weight: 500;
  }
  .overlay form { display: flex; flex-direction: column; gap: 18px; }
  .overlay label {
    font-family: 'Inter', sans-serif;
    font-size: 10px; letter-spacing: 2.8px; text-transform: uppercase;
    color: #847866; font-weight: 500;
    margin-bottom: 6px; display: block;
  }
  .overlay .opt { text-transform: none; letter-spacing: 0; font-size: 11px; color: #b8ad97; margin-left: 6px; }
  .overlay input, .overlay textarea {
    width: 100%;
    background: transparent; border: none;
    border-bottom: 1px solid rgba(26,22,18,0.15);
    color: #1a1612; font-family: 'Inter', sans-serif;
    font-size: 15px; padding: 10px 0;
    outline: none; border-radius: 0;
    transition: border-color 0.3s ease;
  }
  .overlay input:focus, .overlay textarea:focus { border-bottom-color: #6e5538; }
  .overlay textarea { resize: vertical; min-height: 72px; }
  .overlay .submit {
    margin-top: 10px;
    background: #1a1612; color: #fff;
    padding: 16px 32px; font-family: 'Inter', sans-serif;
    font-size: 11px; letter-spacing: 2.8px; text-transform: uppercase;
    font-weight: 500; cursor: pointer; border: none;
    transition: background 0.3s ease;
  }
  .overlay .submit:hover { background: #6e5538; }
  .overlay .submit:disabled { opacity: 0.5; cursor: wait; }
  .overlay .status {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 14px;
    min-height: 20px; margin-top: 4px;
  }
  .overlay .status.error { color: #a04040; }
  .overlay .alt {
    margin-top: 18px; padding-top: 18px;
    border-top: 1px solid rgba(26,22,18,0.1);
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px; color: #847866; font-style: italic;
    text-align: center;
  }
  .overlay .alt a {
    color: #1a1612; border-bottom: 1px solid #1a1612;
    text-decoration: none; font-style: normal;
    font-family: 'Inter', sans-serif; font-size: 11px;
    letter-spacing: 2px; text-transform: uppercase;
    padding-bottom: 2px; margin-left: 6px;
  }

  /* Confirmation state */
  .overlay-success { display: none; text-align: center; padding: 20px 0; }
  .overlay-success.show { display: block; }
  .overlay-success .mark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px; color: #6e5538; line-height: 1;
    margin-bottom: 18px;
  }
  .overlay-success h4 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px; font-weight: 300; line-height: 1.2;
    margin-bottom: 14px;
  }
  .overlay-success h4 em { font-style: italic; color: #847866; }
  .overlay-success p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px; color: #1a1612; line-height: 1.55;
    margin-bottom: 24px;
  }

  @media (max-width: 768px) {
    .cat-header { height: 40px; padding: 0 14px; }
    .cat-header .brand { font-size: 10px; letter-spacing: 3px; }
    .cat-header .vols { gap: 14px; }
    .cat-header .vols a { font-size: 9px; letter-spacing: 1.5px; }
    .viewer { padding: 50px 10px 60px; }
    .book { aspect-ratio: 794 / 1123 !important; max-height: 86vh; }
    .page.left, .page.right { box-shadow:none; }
    .book .page:not(.mobile-show) { display:none; }
    .nav-zone { top: 40px; width:40%; }
    .nav-zone:hover::after { display:none; }
    .toolbar { gap:8px; height:50px; padding: 0 8px; }
    .toolbar button, .toolbar .icon-btn { padding:6px 10px; font-size:9px; letter-spacing:1.5px; }
    .toolbar .cta { padding:6px 14px; }
    .counter { min-width: 70px; font-size: 10px; }
    .overlay-inner { padding: 36px 24px; max-height: 94vh; }
    .overlay h3 { font-size: 24px; }
  }

  .print-container { display:none; }
 /* iOS Safari bottom-bar safe area + small phone refinements */
.toolbar {
  padding-bottom: env(safe-area-inset-bottom, 0);

@media (max-width: 768px) {

}
@media (max-width: 400px) {
  .cat-header { padding: 0 10px; }

}

<script>
const IMG = {
  torsionHero:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779392874/twisted_table_hero_qmewze.webp',
  torsionSide:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779392873/twisted_table_side_jz9hw2.webp',

  vegaHero:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779379620/v_table_hero_buw0zb.webp',
  vegaTop:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779379636/v_table_top_view_vgwcyw.webp',
  serpaHero:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779379436/snake_table_hero_vjsy3x.jpg',
  serpaUse:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779379443/snake_table_in_use_fx32n1.webp',
  seuilHero:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779392794/v_entrance_table_herp_rmbbrt.jpg',
  seuilSide:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779392790/v_entrance_table_side_rveoio.jpg',
  apexHero:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779389975/a_table_hero_jladkf.webp',
  apexLife:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779389973/a_table_life_style_ivvazr.webp',
  ondeAlone:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779392514/w_table_alone_y2kwo8.webp',
  ondeChair:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779392514/w_table_with_chair_c5ohps.webp',
  basseHero:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779392414/coffee_table_hero_itnlmg.jpg',
  basseAngle:'https://res.cloudinary.com/dlo4exspj/image/upload/v1779392401/coffee_table_other_angel_v13rna.png'
};

const VB = 'viewBox="0 0 794 1123" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"';
const header = (label) => `
  <text x="60" y="60" font-family="Inter" font-size="9" font-weight="500" letter-spacing="3">AURÉLIS — TABLES</text>
  <text x="734" y="60" font-family="Inter" font-size="9" font-weight="500" letter-spacing="3" text-anchor="end">${label}</text>`;
const folio = (n, label='', light=false) => {
  const fill = light ? 'fill="#fff" opacity="0.8"' : '';
  const lfill = light ? 'fill="#fff" opacity="0.6"' : 'opacity="0.5"';
  return `<text x="60" y="1080" font-family="Inter" font-size="9" font-weight="500" letter-spacing="2" ${fill}>${String(n).padStart(3,'0')}</text>
  ${label?`<text x="734" y="1080" font-family="Inter" font-size="9" letter-spacing="2" text-anchor="end" ${lfill}>${label}</text>`:''}`;
};

const layoutA = ({n,name,voice,desc,img,label}) => `
<svg ${VB}>
  <rect width="794" height="1123" fill="#fff"/>
  ${header(label)}
  <image href="${img}" x="60" y="100" width="674" height="640" preserveAspectRatio="xMidYMid slice"/>
  <text x="60" y="820" font-family="Inter" font-size="64" font-weight="300" letter-spacing="2">${name}</text>
  <text x="60" y="852" font-family="Inter" font-size="10" letter-spacing="3" opacity="0.6">${voice}</text>
  <line x1="60" y1="880" x2="160" y2="880" stroke="#000"/>
  ${desc.map((l,i)=>`<text x="60" y="${920+i*18}" font-family="Inter" font-size="10.5" font-weight="300">${l}</text>`).join('')}
  ${folio(n,label)}
</svg>`;

const layoutB = ({n,name,voice,desc,img,label}) => `
<svg ${VB}>
  <rect width="794" height="1123" fill="#fff"/>
  ${header(label)}
  <text x="60" y="180" font-family="Inter" font-size="64" font-weight="300" letter-spacing="2">${name}</text>
  <text x="60" y="212" font-family="Inter" font-size="10" letter-spacing="3" opacity="0.6">${voice}</text>
  <line x1="60" y1="240" x2="160" y2="240" stroke="#000"/>
  ${desc.map((l,i)=>`<text x="60" y="${280+i*18}" font-family="Inter" font-size="10.5" font-weight="300">${l}</text>`).join('')}
  <image href="${img}" x="60" y="420" width="674" height="620" preserveAspectRatio="xMidYMid slice"/>
  ${folio(n,label)}
</svg>`;

const layoutSpecs = ({n,img,specs,plateau,label}) => {
  const specRows = specs.map((s,i)=>`
    <text x="60" y="${760+i*22}" font-family="JetBrains Mono" font-size="10">${s.dim}</text>
    <text x="500" y="${760+i*22}" font-family="JetBrains Mono" font-size="10" opacity="0.5">${s.note}</text>`).join('');
  const plateauY = 760 + specs.length*22 + 30;
  return `
<svg ${VB}>
  <rect width="794" height="1123" fill="#fff"/>
  ${header(label)}
  <image href="${img}" x="60" y="100" width="674" height="580" preserveAspectRatio="xMidYMid slice"/>
  <line x1="60" y1="720" x2="734" y2="720" stroke="#000" stroke-width="0.5"/>
  <text x="60" y="745" font-family="Inter" font-size="10" font-weight="600" letter-spacing="3">DIMENSIONS</text>

// ====== SPREAD LOGIC ======
const CATALOG_NAME = 'Tables';
const WA_NUMBER = '212661420939';
const isMobile = () => window.innerWidth <= 768;
let pageCursor = 0;
let spreadCursor = 0;
const LAST_PAGE = pages.length - 1;
const LAST_SPREAD = Math.ceil(LAST_PAGE / 2);

function getSpread(s) {
  if (s === 0) return [0];
  if (s === LAST_SPREAD) return [LAST_PAGE];
  return [2*s - 1, 2*s];
}

function currentPiece() {
  if (isMobile()) return pages[pageCursor].piece;
  const spread = getSpread(spreadCursor);
  for (const idx of spread) {
    if (pages[idx] && pages[idx].piece) return pages[idx].piece;
  }
  return '';
}

function updateWaLink() {
  const piece = currentPiece();
  const text = piece
    ? `Bonjour, je suis intéressé(e) par la pièce ${piece} du catalogue ${CATALOG_NAME} d'Aurélis.`
    : `Bonjour, je découvre votre catalogue ${CATALOG_NAME} et j'aimerais en savoir plus.`;
  const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`;
  document.getElementById('waBtn').href = url;
  document.getElementById('waAlt').href = url;
}

function render() {
  const book = document.getElementById('book');
  book.innerHTML = '';
  if (isMobile()) {
    book.className = 'book single';
    const div = document.createElement('div');
    div.className = 'page mobile-show';
    div.innerHTML = pages[pageCursor].html;
    book.appendChild(div);
    document.getElementById('counter').textContent =
      String(pageCursor).padStart(2,'0') + ' / ' + String(LAST_PAGE).padStart(2,'0');
  } else {
    const spread = getSpread(spreadCursor);
    book.className = 'book' + (spread.length===1 ? ' single' : '');
    spread.forEach((idx,i) => {
      const div = document.createElement('div');
      div.className = 'page ' + (spread.length===1 ? '' : (i===0?'left':'right'));
      div.innerHTML = pages[idx].html;
      book.appendChild(div);
    });
    document.getElementById('counter').textContent =
      String(spread[0]).padStart(2,'0') + (spread[1]!==undefined?'–'+String(spread[1]).padStart(2,'0'):'') +
      ' / ' + String(LAST_PAGE).padStart(2,'0');
  }
  updateWaLink();
}

function next() {
  if (isMobile()) { if (pageCursor < LAST_PAGE) { pageCursor++; render(); } }
  else { if (spreadCursor < LAST_SPREAD) { spreadCursor++; render(); } }
}
function prev() {
  if (isMobile()) { if (pageCursor > 0) { pageCursor--; render(); } }
  else { if (spreadCursor > 0) { spreadCursor--; render(); } }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
  if (e.key === 'Escape') closeEnquiry();
});

let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (document.getElementById('enquiryOverlay').classList.contains('show')) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -50) next();
  if (dx > 50) prev();
}, {passive:true});

// ====== ENQUIRY OVERLAY ======
function openEnquiry() {
  const piece = currentPiece();
  document.getElementById('pieceField').value = piece || '(pièce non spécifiée)';
  document.getElementById('pieceBadge').textContent =
    (piece || 'Catalogue') + ' · ' + CATALOG_NAME;
  document.getElementById('enquiryOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeEnquiry() {
  document.getElementById('enquiryOverlay').classList.remove('show');
  document.body.style.overflow = '';
  // reset to form state for next open
  setTimeout(() => {
    document.getElementById('enquiryForm').style.display = 'block';
    document.getElementById('enquirySuccess').classList.remove('show');
    document.getElementById('catForm').reset();
    document.getElementById('catStatus').textContent = '';
    document.getElementById('catSubmit').disabled = false;
    document.getElementById('catSubmit').textContent = 'Envoyer la demande';
  }, 300);
}

const catForm = document.getElementById('catForm');
catForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('catSubmit');
  const status = document.getElementById('catStatus');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  status.className = 'status'; status.textContent = '';
  try {
    const r = await fetch(catForm.action, {
      method: 'POST',
      body: new FormData(catForm),
      headers: { 'Accept': 'application/json' }
    });
    if (r.ok) {
      document.getElementById('enquiryForm').style.display = 'none';
      document.getElementById('enquirySuccess').classList.add('show');
    } else {
      status.className = 'status error';
      status.textContent = 'Une erreur est survenue. Merci de réessayer.';
      btn.disabled = false; btn.textContent = 'Envoyer la demande';
    }
  } catch (err) {
    status.className = 'status error';
    status.textContent = 'Une erreur est survenue. Réessayez ou écrivez à contact@aurelis.ma.';
    btn.disabled = false; btn.textContent = 'Envoyer la demande';
  }
});

window.addEventListener('resize', render);
render();
 

</script>

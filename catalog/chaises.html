// === SPREAD LOGIC ===
const isMobile = () => window.innerWidth <= 768;
let pageCursor = 0;
let spreadCursor = 0;
const LAST_SPREAD = 22;

function getSpread(s) {
  if (s === 0) return [0];
  if (s === LAST_SPREAD) return [43];
  return [2*s - 1, 2*s];
}

function render() {
  const book = document.getElementById('book');
  book.innerHTML = '';
  if (isMobile()) {
    book.className = 'book single';
    const div = document.createElement('div');
    div.className = 'page mobile-show';
    div.innerHTML = pages[pageCursor];
    book.appendChild(div);
    document.getElementById('counter').textContent =
      String(pageCursor).padStart(2,'0') + ' / ' + String(pages.length-1).padStart(2,'0');
  } else {
    const spread = getSpread(spreadCursor);
    book.className = 'book' + (spread.length===1 ? ' single' : '');
    spread.forEach((idx,i) => {
      const div = document.createElement('div');
      div.className = 'page ' + (spread.length===1 ? '' : (i===0?'left':'right'));
      div.innerHTML = pages[idx];
      book.appendChild(div);
    });
    document.getElementById('counter').textContent =
      String(spread[0]).padStart(2,'0') + (spread[1]!==undefined?'–'+String(spread[1]).padStart(2,'0'):'') +
      ' / ' + String(pages.length-1).padStart(2,'0');
  }
}

function next() {
  if (isMobile()) { if (pageCursor < pages.length-1) { pageCursor++; render(); } }
  else { if (spreadCursor < LAST_SPREAD) { spreadCursor++; render(); } }
}
function prev() {
  if (isMobile()) { if (pageCursor > 0) { pageCursor--; render(); } }
  else { if (spreadCursor > 0) { spreadCursor--; render(); } }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -50) next();
  if (dx > 50) prev();
}, {passive:true});

function preparePrint() {
  const container = document.getElementById('printContainer');
  container.innerHTML = '';
  pages.forEach(pageHTML => {
    const div = document.createElement('div');
    div.className = 'page';
    div.innerHTML = pageHTML;
    container.appendChild(div);
  });
  setTimeout(() => { window.print(); }, 600);
}

window.addEventListener('resize', render);
render();
</script>
</body>
</html>

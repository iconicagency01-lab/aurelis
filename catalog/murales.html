const CATALOG_NAME = 'Sculptures murales';
const WA_NUMBER = '212661420939';
const isMobile = () => window.innerWidth <= 768;
let pageCursor = 0, spreadCursor = 0;
const LAST_PAGE = pages.length - 1;
const LAST_SPREAD = Math.ceil(LAST_PAGE / 2);

function getSpread(s) { if (s===0) return [0]; if (s===LAST_SPREAD) return [LAST_PAGE]; return [2*s-1, 2*s]; }
function currentPiece() { if (isMobile()) return pages[pageCursor].piece; const spread = getSpread(spreadCursor); for (const idx of spread) { if (pages[idx] && pages[idx].piece) return pages[idx].piece; } return ''; }
function updateWaLink() { const p = currentPiece(); const t = p ? `Bonjour, je suis intéressé(e) par la pièce ${p} du catalogue ${CATALOG_NAME} d'Aurélis.` : `Bonjour, je découvre votre catalogue ${CATALOG_NAME} et j'aimerais en savoir plus.`; const u = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t)}`; document.getElementById('waBtn').href = u; document.getElementById('waAlt').href = u; }
function render() {
  const book = document.getElementById('book'); book.innerHTML = '';
  if (isMobile()) {
    book.className = 'book single';
    const d = document.createElement('div'); d.className = 'page mobile-show'; d.innerHTML = pages[pageCursor].html; book.appendChild(d);
    document.getElementById('counter').textContent = String(pageCursor).padStart(2,'0') + ' / ' + String(LAST_PAGE).padStart(2,'0');
  } else {
    const spread = getSpread(spreadCursor);
    book.className = 'book' + (spread.length===1 ? ' single' : '');
    spread.forEach((idx,i) => { const d = document.createElement('div'); d.className = 'page ' + (spread.length===1?'':(i===0?'left':'right')); d.innerHTML = pages[idx].html; book.appendChild(d); });
    document.getElementById('counter').textContent = String(spread[0]).padStart(2,'0') + (spread[1]!==undefined?'–'+String(spread[1]).padStart(2,'0'):'') + ' / ' + String(LAST_PAGE).padStart(2,'0');
  }
  updateWaLink();
}
function next() { if (isMobile()) { if (pageCursor<LAST_PAGE) { pageCursor++; render(); } } else { if (spreadCursor<LAST_SPREAD) { spreadCursor++; render(); } } }
function prev() { if (isMobile()) { if (pageCursor>0) { pageCursor--; render(); } } else { if (spreadCursor>0) { spreadCursor--; render(); } } }
document.addEventListener('keydown', e => { if (e.key==='ArrowRight') next(); if (e.key==='ArrowLeft') prev(); if (e.key==='Escape') closeEnquiry(); });
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => { if (document.getElementById('enquiryOverlay').classList.contains('show')) return; const dx = e.changedTouches[0].clientX - touchStartX; if (dx<-50) next(); if (dx>50) prev(); }, {passive:true});

function openEnquiry() {
  const piece = currentPiece();
  document.getElementById('pieceField').value = piece || '(pièce non spécifiée)';
  document.getElementById('pieceBadge').textContent = (piece || 'Catalogue') + ' · ' + CATALOG_NAME;
  document.getElementById('enquiryOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeEnquiry() {
  document.getElementById('enquiryOverlay').classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(() => {
    document.getElementById('enquiryForm').style.display = 'block';
    document.getElementById('enquirySuccess').classList.remove('show');
    document.getElementById('catForm').reset();
    document.getElementById('catStatus').textContent = '';
    document.getElementById('catSubmit').disabled = false;
    document.getElementById('catSubmit').textContent = 'Envoyer la demande';
  }, 300);
}
const catForm = document.getElementById('catForm');
catForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('catSubmit');
  const status = document.getElementById('catStatus');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  status.className = 'status'; status.textContent = '';
  try {
    const r = await fetch(catForm.action, { method:'POST', body:new FormData(catForm), headers:{'Accept':'application/json'} });
    if (r.ok) {
      document.getElementById('enquiryForm').style.display = 'none';
      document.getElementById('enquirySuccess').classList.add('show');
    } else {
      status.className = 'status error'; status.textContent = 'Une erreur est survenue. Merci de réessayer.';
      btn.disabled = false; btn.textContent = 'Envoyer la demande';
    }
  } catch (err) {
    status.className = 'status error'; status.textContent = 'Une erreur est survenue. Réessayez ou écrivez à contact@aurelis.ma.';
    btn.disabled = false; btn.textContent = 'Envoyer la demande';
  }
});
window.addEventListener('resize', render);
render();
 /* iOS Safari bottom-bar safe area + small phone refinements */
.toolbar {
  padding-bottom: env(safe-area-inset-bottom, 0);
  height: calc(55px + env(safe-area-inset-bottom, 0));
}
.cat-header {
  padding-top: env(safe-area-inset-top, 0);
  height: calc(44px + env(safe-area-inset-top, 0));
}
.nav-zone {
  top: calc(44px + env(safe-area-inset-top, 0));
  bottom: calc(70px + env(safe-area-inset-bottom, 0));
}
@media (max-width: 768px) {
  .toolbar { height: calc(50px + env(safe-area-inset-bottom, 0)); }
  .cat-header { height: calc(40px + env(safe-area-inset-top, 0)); }
  .nav-zone { top: calc(40px + env(safe-area-inset-top, 0)); }
}
@media (max-width: 400px) {
  .cat-header { padding: 0 10px; }
  .cat-header .brand { font-size: 9px; letter-spacing: 2.5px; }
  .cat-header .vols { gap: 10px; }
  .cat-header .vols a { font-size: 8.5px; letter-spacing: 1px; }
  .toolbar { gap: 6px; padding: 0 6px; }
  .toolbar button, .toolbar .icon-btn { padding: 5px 8px; font-size: 8.5px; letter-spacing: 1px; }
  .toolbar .cta { padding: 5px 11px; }
  .counter { min-width: 58px; font-size: 9px; }
}

</script>

<title>AURÉLIS — Pièce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1612; --paper:#ffffff; --bone:#eeeae3; --soft:#f6f4f0;
  --accent:#6e5538; --line:rgba(26,22,18,.12);
  --serif:'Cormorant Garamond',serif; --sans:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.micro{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:400}

.utility{background:var(--ink);color:#e8e2d6;padding:8px 24px;display:flex;justify-content:flex-end;gap:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.utility a{opacity:.75}
.utility a:hover{opacity:1}

.nav{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line);padding:18px 32px;display:flex;justify-content:space-between;align-items:center}
.nav .brand{font-family:var(--serif);font-size:22px;letter-spacing:.32em}
.nav .links{display:flex;gap:28px}
.nav .links a{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}

.breadcrumb{padding:24px 32px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.breadcrumb a{margin-right:8px}
.breadcrumb span{margin-right:8px}

/* Product layout */
.product{display:grid;grid-template-columns:1.2fr 1fr;gap:0;min-height:80vh}
.product .hero{
  background:var(--bone);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px;
}
.product .hero img{
  max-width:100%;
  max-height:70vh;
  object-fit:contain;
}
.product .details{padding:80px 60px;display:flex;flex-direction:column;justify-content:center}
.product .cat{margin-bottom:18px;opacity:.6}
.product h1{font-family:var(--serif);font-size:clamp(40px,5vw,60px);font-weight:300;letter-spacing:.02em;margin-bottom:14px}
.product .quote{font-family:var(--serif);font-style:italic;font-size:20px;opacity:.75;margin-bottom:32px}
.product .desc{font-size:15px;line-height:1.8;opacity:.8;margin-bottom:36px;max-width:480px}

.specs{border-top:1px solid var(--line);padding-top:24px;margin-bottom:32px}
.spec-row{display:flex;padding:10px 0;font-size:13px;border-bottom:1px solid var(--line)}
.spec-row .label{flex:0 0 130px;opacity:.55;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding-top:2px}
.spec-row .value{flex:1;line-height:1.6}

.meta{margin-bottom:32px;font-size:13px;opacity:.7;line-height:1.8}
.cta-row{display:flex;gap:14px;flex-wrap:wrap}
.cta-row a{display:inline-block;padding:14px 28px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--ink);transition:all .2s}
.cta-row a.primary{background:var(--ink);color:var(--paper)}
.cta-row a.primary:hover{background:var(--accent);border-color:var(--accent)}
.cta-row a.ghost:hover{background:var(--ink);color:var(--paper)}

/* Gallery */
.gallery{padding:80px 32px;background:var(--soft)}
.gallery h2{font-family:var(--serif);font-size:32px;font-weight:300;text-align:center;margin-bottom:40px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;max-width:1300px;margin:0 auto}
.gallery-grid .img-wrap{aspect-ratio:4/5;background:var(--bone);overflow:hidden}
.gallery-grid img{width:100%;height:100%;object-fit:contain;background:var(--bone)}

/* Related */
.related{padding:80px 32px;border-top:1px solid var(--line)}
.related h2{font-family:var(--serif);font-size:32px;font-weight:300;text-align:center;margin-bottom:40px}
.related-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px;max-width:1100px;margin:0 auto}
.related .card{cursor:pointer}
.related .card .img-wrap{aspect-ratio:4/5;background:var(--bone);overflow:hidden}
.related .card img{width:100%;height:100%;object-fit:contain;background:var(--bone)}
.related .card .name{font-family:var(--serif);font-size:20px;margin-top:14px;text-align:center}
.related .card .cat{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.5;text-align:center;margin-top:4px}

footer{padding:48px 32px;border-top:1px solid var(--line);text-align:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.55}
footer a{margin:0 12px}

@media(max-width:900px){
  .product{grid-template-columns:1fr}
  .product .hero{padding:40px 20px;min-height:60vh}
  .product .details{padding:50px 24px}
  .gallery, .related{padding:60px 18px}
}
</style>
</head>
<body>

<div class="utility">
  <a href="https://www.instagram.com/aurelis.maroc" target="_blank">Instagram</a>
  <a href="https://wa.me/212661420939" target="_blank">WhatsApp</a>
</div>

<nav class="nav">
  <a href="index.html" class="brand">AURÉLIS</a>
  <div class="links">
    <a href="index.html">Accueil</a>
    <a href="catalogues.html">Catalogues</a>
    <a href="produits-tables.html">Tables</a>
  </div>
</nav>

<div class="breadcrumb" id="breadcrumb"></div>

<section class="product" id="product"></section>

<section class="gallery" id="gallery" style="display:none">
  <h2>Galerie</h2>
  <div class="gallery-grid" id="galleryGrid"></div>
</section>

<section class="related" id="related" style="display:none">
  <h2>Voir aussi</h2>
  <div class="related-grid" id="relatedGrid"></div>
</section>

<footer>
  <a href="index.html">Accueil</a>
  <a href="catalogues.html">Catalogues</a>
  <a href="https://www.instagram.com/aurelis.maroc" target="_blank">Instagram</a>
  <span>© AURÉLIS Casablanca</span>
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const collection = params.get('collection') || 'tables';
const id = params.get('id');

const listPages = {
  tables: 'produits-tables.html',
  chaises: 'produits-chaises.html',
  murales: 'produits-murales.html'
};
const listLabels = {
  tables: 'Tables',
  chaises: 'Chaises',
  murales: 'Murales'
};

fetch('products.json')
  .then(r => r.json())
  .then(data => {
    const items = data[collection] || [];
    const p = items.find(x => x.id === id);
    if(!p){
      document.getElementById('product').innerHTML = '<div style="padding:80px;text-align:center;font-family:Cormorant Garamond,serif;font-style:italic;opacity:.5">Pièce introuvable.</div>';
      return;
    }
    document.title = `AURÉLIS — ${p.name}`;
    renderBreadcrumb(p);
    renderProduct(p);
    renderGallery(p);
    renderRelated(items, p);

    if(window.fbq){
      fbq('track','ViewContent',{
        content_name: p.id,
        content_category: collection,
        content_type: 'product'
      });
    }
  })
  .catch(err => {
    document.getElementById('product').innerHTML = '<div style="padding:80px;text-align:center;opacity:.5">Erreur de chargement.</div>';
    console.error(err);
  });

function renderBreadcrumb(p){
  document.getElementById('breadcrumb').innerHTML = `
    <a href="index.html">Accueil</a><span>·</span>
    <a href="${listPages[collection]}">${listLabels[collection]}</a><span>·</span>
    <span style="opacity:1">${p.name}</span>
  `;
}

function renderProduct(p){
  const waText = encodeURIComponent(`Bonjour AURÉLIS, je suis intéressé(e) par la pièce ${p.name}.`);
  document.getElementById('product').innerHTML = `
    <div class="hero">
      <img src="${p.hero}" alt="${p.name}">
    </div>
    <div class="details">
      <div class="cat micro">${p.category}</div>
      <h1>${p.name}</h1>
      <div class="quote">${p.quote}</div>
      <div class="desc">${p.description}</div>
      <div class="specs">
        <div class="spec-row"><div class="label">Dimensions</div><div class="value">${p.dimensions}</div></div>
        <div class="spec-row"><div class="label">Matériaux</div><div class="value">${p.materials}</div></div>
      </div>
      <div class="meta">
        Fabriqué à Casablanca · Sur commande<br>
        Délai 6 à 8 semaines · Prix sur demande
      </div>
      <div class="cta-row">
        <a class="primary" href="https://wa.me/212661420939?text=${waText}" target="_blank" id="ctaProduct">Demander un devis</a>
        <a class="ghost" href="catalogues.html">Voir les catalogues</a>
      </div>
    </div>
  `;

  const cta = document.getElementById('ctaProduct');
  if(cta){
    cta.addEventListener('click', () => {
      if(window.fbq){
        fbq('track','Lead',{content_name:p.id,content_category:collection});
      }
    });
  }
}

function renderGallery(p){
  if(!p.gallery || p.gallery.length === 0) return;
  document.getElementById('gallery').style.display = 'block';
  document.getElementById('galleryGrid').innerHTML = p.gallery.map(url =>
    `<div class="img-wrap"><img src="${url}" alt="${p.name}" loading="lazy"></div>`
  ).join('');
}

function renderRelated(items, current){
  const others = items.filter(x => x.id !== current.id);
  if(others.length === 0) return;
  // pick up to 3 random others
  const picks = others.sort(() => Math.random() - 0.5).slice(0, 3);
  document.getElementById('related').style.display = 'block';
  document.getElementById('relatedGrid').innerHTML = picks.map(p => `
    <a href="produit.html?collection=${collection}&id=${p.id}" class="card">
      <div class="img-wrap"><img src="${p.hero}" alt="${p.name}" loading="lazy"></div>
      <div class="name">${p.name}</div>
      <div class="cat">${p.category}</div>
    </a>
  `).join('');
}
</script>

</body>
</html>

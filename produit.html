<title>AURÉLIS — Pièce</title>
<meta name="description" content="Pièce AURÉLIS — fabriquée à la main à Casablanca. Sur commande.">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='50' font-family='Cormorant Garamond, EB Garamond, Georgia, Times New Roman, serif' font-size='56' font-weight='500' fill='%231a1612' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">

<style>
  :root {
    --ink: #1a1612; --paper: #ffffff; --paper-alt: #f6f4f0; --bone: #eeeae3;
    --mute: #847866; --soft: #b8ad97; --accent: #6e5538;
    --line: rgba(26,22,18,0.12);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; font-weight: 400; background: var(--paper); color: var(--ink); overflow-x: hidden; line-height: 1.55; font-size: 14px; }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  .micro { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 500; }

  .utility { position: fixed; top: 0; left: 0; right: 0; background: var(--ink); color: var(--paper); padding: 8px 40px; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; z-index: 101; }
  .utility .left, .utility .right { display: flex; gap: 28px; }

  nav { position: fixed; top: 32px; left: 0; right: 0; padding: 22px 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; z-index: 100; background: rgba(255,255,255,0.96); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); transition: padding 0.4s var(--ease); }
  nav.scrolled { padding: 16px 40px; }
  nav .links-left, nav .links-right { display: flex; gap: 36px; }
  nav .links-right { justify-content: flex-end; }
  nav .links-left a, nav .links-right a { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 500; }
  nav .links-left a:hover, nav .links-right a:hover { color: var(--accent); }
  nav .mark { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; letter-spacing: 0.32em; text-align: center; text-transform: uppercase; line-height: 1; }
  nav.scrolled .mark { font-size: 22px; }
  nav .mark .tag { display: block; font-size: 8px; letter-spacing: 0.4em; color: var(--mute); margin-top: 4px; }
  nav.scrolled .mark .tag { display: none; }
  .burger { display: none; }
  @media (max-width: 900px) {
    .utility { display: none; }
    nav { top: 0; padding: 14px 20px; grid-template-columns: auto 1fr auto; }
    nav .links-left, nav .links-right { display: none; }
    nav .mark { font-size: 20px; text-align: left; grid-column: 2; justify-self: start; padding-left: 8px; }
    nav .mark .tag { display: none; }
    .burger { display: flex; width: 26px; height: 14px; flex-direction: column; justify-content: space-between; cursor: pointer; grid-column: 3; }
    .burger span { display: block; height: 1px; background: var(--ink); width: 100%; transition: transform 0.3s; }
    nav.open .links-left, nav.open .links-right { display: flex; flex-direction: column; position: fixed; inset: 0; background: var(--paper); justify-content: center; align-items: center; gap: 28px; z-index: 99; padding: 80px 22px; }
    nav.open .burger span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    nav.open .burger span:nth-child(2) { opacity: 0; }
    nav.open .burger span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  }

  .crumbs { margin-top: 112px; padding: 30px 60px 0; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); }
  .crumbs a:hover { color: var(--ink); }
  .crumbs .sep { margin: 0 12px; opacity: 0.4; }
  @media (max-width: 900px) { .crumbs { margin-top: 50px; padding: 20px 22px 0; font-size: 10px; } }

  .product-top { padding: 40px 60px 80px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 60px; align-items: start; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 1000px) { .product-top { grid-template-columns: 1fr; padding: 24px 22px 50px; gap: 40px; } }

  .hero-wrap { aspect-ratio: 4/5; overflow: hidden; background: var(--bone); }
  .hero-wrap img { width: 100%; height: 100%; object-fit: cover; }

  .info .category { color: var(--mute); margin-bottom: 14px; }
  .info h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(40px, 5vw, 64px); font-weight: 300; letter-spacing: 0.02em; line-height: 1; margin-bottom: 18px; text-transform: uppercase; }
  .info .quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; color: var(--mute); line-height: 1.35; margin-bottom: 32px; }
  .info .description { font-size: 14px; line-height: 1.7; color: var(--ink); margin-bottom: 40px; max-width: 460px; }

  .specs { border-top: 1px solid var(--line); padding-top: 28px; margin-bottom: 36px; }
  .specs h3 { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 600; margin-bottom: 16px; color: var(--ink); }
  .specs .row { display: flex; justify-content: space-between; padding: 8px 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; border-bottom: 1px dotted var(--line); }
  .specs .row .note { color: var(--mute); }
  .specs .materials { margin-top: 22px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink); }

  .meta-block { background: var(--paper-alt); padding: 22px 24px; margin-bottom: 28px; }
  .meta-block .line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; }
  .meta-block .line .k { color: var(--mute); letter-spacing: 0.1em; text-transform: uppercase; font-size: 10px; }
  .meta-block .line .v { font-family: 'JetBrains Mono', monospace; }

  .cta-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-primary { background: var(--ink); color: var(--paper); padding: 18px 32px; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; font-weight: 500; display: inline-flex; align-items: center; gap: 12px; transition: background 0.4s var(--ease); border: none; cursor: pointer; }
  .btn-primary:hover { background: var(--accent); }
  .btn-outline { background: transparent; color: var(--ink); padding: 18px 32px; border: 1px solid var(--ink); font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; font-weight: 500; display: inline-flex; align-items: center; gap: 12px; transition: background 0.4s var(--ease), color 0.4s var(--ease); }
  .btn-outline:hover { background: var(--ink); color: var(--paper); }

  .gallery { padding: 0 60px 100px; max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  @media (max-width: 900px) { .gallery { padding: 0 22px 70px; grid-template-columns: 1fr; gap: 16px; } }
  .gallery .g { aspect-ratio: 4/5; overflow: hidden; background: var(--bone); }
  .gallery .g img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.4s var(--ease); }
  .gallery .g:hover img { transform: scale(1.04); }

  .related { background: var(--paper-alt); padding: 80px 60px; border-top: 1px solid var(--line); }
  .related h2 { font-family: 'Cormorant Garamond', serif; font-size: clamp(28px, 3.5vw, 42px); font-weight: 300; text-align: center; margin-bottom: 50px; }
  .related h2 em { font-style: italic; color: var(--accent); }
  .related-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; max-width: 1300px; margin: 0 auto; }
  @media (max-width: 900px) { .related { padding: 50px 22px; } .related-grid { grid-template-columns: 1fr; gap: 30px; } }
  .related-grid .r { display: block; }
  .related-grid .r .img-wrap { aspect-ratio: 4/5; overflow: hidden; background: var(--bone); margin-bottom: 14px; }
  .related-grid .r img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.4s var(--ease); }
  .related-grid .r:hover img { transform: scale(1.05); }
  .related-grid .r .cat { color: var(--mute); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; margin-bottom: 6px; }
  .related-grid .r .nm { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; letter-spacing: 0.06em; }

  footer { background: var(--ink); color: var(--paper); padding: 50px 60px 30px; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; }
  footer .row-f { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 26px; margin-bottom: 26px; }
  footer .mark-foot { font-family: 'Cormorant Garamond', serif; font-size: 22px; letter-spacing: 0.32em; text-transform: uppercase; }
  footer .links { display: flex; gap: 26px; flex-wrap: wrap; }
  footer .legal { text-align: center; color: rgba(255,255,255,0.5); font-size: 10px; letter-spacing: 0.2em; }
  @media (max-width: 900px) { footer { padding: 36px 22px 24px; } footer .row-f { flex-direction: column; align-items: flex-start; gap: 18px; } }
</style>
</head>
<body>

<div class="utility">
  <div class="left">
    <a href="https://www.instagram.com/aurelis.maroc" target="_blank" rel="noopener">Instagram</a>
    <a href="https://wa.me/212661420939" target="_blank" rel="noopener">WhatsApp</a>
  </div>
  <div class="right">
    <span>Atelier Casablanca</span>
    <span>Sur commande</span>
  </div>
</div>

<nav id="nav">
  <div class="links-left">
    <a href="index.html">Accueil</a>
    <a href="catalogues.html">Catalogues</a>
    <a href="produits-tables.html">Tables</a>
  </div>
  <a href="index.html" class="mark">
    AURÉLIS
    <span class="tag">L'art de la forme</span>
  </a>
  <div class="links-right">
    <a href="catalog/tables.html">Voir le catalogue</a>
    <a href="https://wa.me/212661420939" target="_blank" rel="noopener">Contact</a>
  </div>
  <div class="burger" id="burger"><span></span><span></span><span></span></div>
</nav>

<div class="crumbs">
  <a href="index.html">Accueil</a>
  <span class="sep">·</span>
  <a href="produits-tables.html" id="crumbCollection">Tables</a>
  <span class="sep">·</span>
  <span id="crumbName">—</span>
</div>

<main id="main"></main>

<section class="related" id="relatedSection" style="display:none">
  <h2>Voir <em>aussi</em></h2>
  <div class="related-grid" id="relatedGrid"></div>
</section>

<footer>
  <div class="row-f">
    <div class="mark-foot">AURÉLIS</div>
    <div class="links">
      <a href="index.html">Accueil</a>
      <a href="catalogues.html">Catalogues</a>
      <a href="produits-tables.html">Tables</a>
      <a href="https://www.instagram.com/aurelis.maroc" target="_blank" rel="noopener">Instagram</a>
      <a href="mentions-legales.html">Mentions légales</a>
    </div>
  </div>
  <div class="legal">© AURÉLIS — Atelier Casablanca</div>
</footer>

<script>
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 30));
  document.getElementById('burger').addEventListener('click', () => nav.classList.toggle('open'));

  const params = new URLSearchParams(location.search);
  const collection = params.get('collection') || 'tables';
  const id = params.get('id');

  fetch('products.json').then(r => r.json()).then(data => {
    const coll = data[collection];
    if (!coll) { renderMissing(); return; }
    const product = coll.items.find(p => p.id === id);
    if (!product) { renderMissing(); return; }
    renderProduct(product, coll);
  });

  function renderMissing() {
    document.getElementById('main').innerHTML = '<div style="padding:120px 60px;text-align:center;font-family:Cormorant Garamond,serif;font-style:italic;color:var(--mute);font-size:22px;">Pièce introuvable. <a href="produits-tables.html" style="text-decoration:underline;">Voir toutes les tables</a>.</div>';
  }

  function renderProduct(p, coll) {
    document.title = `AURÉLIS — ${p.name}`;
    document.getElementById('crumbName').textContent = p.name;

    const specRows = p.dimensions.map(d => `<div class="row"><span>${d.size}</span><span class="note">${d.note}</span></div>`).join('');
    const galleryHTML = (p.gallery && p.gallery.length)
      ? `<section class="gallery">${p.gallery.map(g => `<div class="g"><img src="${g}" alt="${p.name}" loading="lazy"></div>`).join('')}</section>`
      : '';

    document.getElementById('main').innerHTML = `
      <section class="product-top">
        <div class="hero-wrap"><img src="${p.hero}" alt="${p.name}"></div>
        <div class="info">
          <div class="category micro">${p.category}</div>
          <h1>${p.name}</h1>
          <div class="quote">« ${p.quote} »</div>
          <div class="description">${p.description}</div>
          <div class="specs">
            <h3>Dimensions</h3>
            ${specRows}
            <div class="materials">${p.materials}</div>
          </div>
          <div class="meta-block">
            <div class="line"><span class="k">Fabrication</span><span class="v">Casablanca</span></div>
            <div class="line"><span class="k">Délai</span><span class="v">6–8 semaines</span></div>
            <div class="line"><span class="k">Tarif</span><span class="v">Sur demande</span></div>
          </div>
          <div class="cta-row">
            <a href="https://wa.me/212661420939?text=${encodeURIComponent('Bonjour, je suis intéressé(e) par la pièce ' + p.name + '.')}" target="_blank" rel="noopener" class="btn-primary" id="ctaWA">Demander un devis <span>→</span></a>
            <a href="catalog/tables.html" class="btn-outline">Voir le catalogue</a>
          </div>
        </div>
      </section>
      ${galleryHTML}
    `;

    // Pixel events
    if (window.fbq) fbq('track', 'ViewContent', { content_name: p.id, content_category: collection, content_type: 'product', content_ids: [p.id] });
    document.getElementById('ctaWA').addEventListener('click', () => {
      if (window.fbq) fbq('track', 'Lead', { content_name: p.id, content_category: collection });
    });

    // Related — 3 other pieces from the same collection
    const others = coll.items.filter(x => x.id !== p.id);
    const picks = [];
    while (picks.length < 3 && others.length) {
      const i = Math.floor(Math.random() * others.length);
      picks.push(others.splice(i, 1)[0]);
    }
    if (picks.length) {
      document.getElementById('relatedSection').style.display = 'block';
      document.getElementById('relatedGrid').innerHTML = picks.map(r => `
        <a href="produit.html?collection=${collection}&id=${r.id}" class="r">
          <div class="img-wrap"><img src="${r.hero}" alt="${r.name}" loading="lazy"></div>
          <div class="cat">${r.category}</div>
          <div class="nm">${r.name}</div>
        </a>
      `).join('');
    }
  }
</script>

</body>
</html>
